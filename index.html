<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro AR Tetris</title>
  <meta property="og:title" content="Retro AR Tetris">
  <meta name="description" content="Retro AR Tetris — Brick Game in Augmented Reality">

  <!-- 8th Wall Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          async crossorigin="anonymous"
          data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
          async crossorigin="anonymous"></script>

  <link rel="stylesheet" href="./src/styles/style.css">
</head>
<body>
  <!-- 8th Wall camera feed -->
  <canvas id="camerafeed"></canvas>

  <!-- Splash screen (hides when AR starts) -->
  <div id="ar-splash">
    <div class="splash-content">
      <h1>Retro AR Tetris</h1>
      <p id="splash-status">Tap to start AR</p>
      <p id="loading-progress"></p>
    </div>
  </div>

  <!-- React game overlay (keyboard, hidden game panels) -->
  <div id="react-root"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
